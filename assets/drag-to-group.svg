  <title id="title">스페이스를 분류로 드래그</title>
  <desc id="description">미분류 스페이스를 개인 분류 제목으로 끌어 놓으면 놓을 자리의 제목 글자가 반전되어 표시되고, 놓은 뒤 개인 분류 아래로 소속이 옮겨지는 과정을 보여주는 설명용 화면입니다. 실제 사용자 데이터나 화면 캡처가 아닙니다.</desc>
